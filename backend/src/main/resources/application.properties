server.port=8080

# Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/shortener
spring.datasource.username=postgres
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
# check the DB schema on startup and adds missing tables/columns.
spring.jpa.hibernate.ddl-auto=update
# Show the SQL in the logs
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT: in production set environment variable JWT_SECRET (min 32 characters for HS256)
app.jwt.secret=${JWT_SECRET:change-me-in-production-min-32-chars-required}
